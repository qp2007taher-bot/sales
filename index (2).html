<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aurel Tronics - Sales Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .loader { border-top-color: #3b82f6; animation: spinner 1.5s linear infinite; }
        @keyframes spinner { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body class="antialiased text-gray-800">

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="fixed inset-0 bg-black/50 z-[100] flex items-center justify-center hidden">
        <div class="bg-white p-5 rounded-xl flex flex-col items-center">
            <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-200 h-12 w-12 mb-4"></div>
            <p class="font-semibold text-blue-600">جاري المعالجة...</p>
        </div>
    </div>

    <!-- Auth Section -->
    <section id="authSection" class="min-h-screen flex items-center justify-center p-4">
        <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-blue-700">أورل ترونكس</h1>
                <p class="text-gray-500 mt-2">نظام مناديب المبيعات الميدانيين</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">اسم المستخدم</label>
                        <input type="text" id="loginUsername" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                        <input type="password" id="loginPassword" class="w-full p-3 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
                    </div>
                    <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200">دخول</button>
                </div>
                <div class="mt-6 flex flex-col gap-3 text-center text-sm">
                    <button onclick="toggleAuthForms('register')" class="text-blue-600 font-semibold underline">إنشاء مستخدم جديد</button>
                    <button onclick="showForgotPassword()" class="text-gray-500">نسيت كلمة المرور؟</button>
                </div>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="hidden">
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">الدولة</label>
                        <select id="regCountry" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="مصر">مصر</option>
                            <option value="السعودية">السعودية</option>
                            <option value="الإمارات">الإمارات</option>
                            <option value="الأردن">الأردن</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">اسم المستخدم الجديد</label>
                        <input type="text" id="regUsername" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">كلمة المرور</label>
                        <input type="password" id="regPassword" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <button onclick="handleRegister()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg transition">تسجيل الحساب</button>
                    <button onclick="toggleAuthForms('login')" class="w-full text-gray-500 text-sm">العودة لتسجيل الدخول</button>
                </div>
            </div>
        </div>
    </section>

    <!-- Main Dashboard -->
    <section id="dashboardSection" class="hidden min-h-screen pb-20">
        <!-- Header -->
        <header class="bg-blue-700 text-white p-6 shadow-lg rounded-b-[2rem]">
            <div class="flex justify-between items-center mb-4">
                <div>
                    <h2 class="text-xl font-bold" id="userDisplayName">مرحباً مندوبنا</h2>
                    <p class="text-blue-100 text-sm" id="userRegion">مصر</p>
                </div>
                <div class="bg-white/20 p-2 rounded-full">
                    <i data-lucide="user" class="w-6 h-6"></i>
                </div>
            </div>
            
            <!-- Monthly Stats Card -->
            <div onclick="showMonthlyStats()" class="bg-white text-blue-900 p-4 rounded-2xl shadow-sm cursor-pointer active:scale-95 transition">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-sm font-semibold opacity-70">إنجازك هذا الشهر</p>
                        <h3 class="text-2xl font-black mt-1" id="monthlyCount">0 زيارة</h3>
                    </div>
                    <i data-lucide="chevron-left" class="w-6 h-6 opacity-50"></i>
                </div>
            </div>
        </header>

        <main class="p-4 space-y-6">
            <!-- Today's Checklist -->
            <section>
                <h4 class="flex items-center gap-2 font-bold mb-4 px-2">
                    <i data-lucide="calendar-check" class="w-5 h-5 text-blue-600"></i>
                    مهام اليوم (Checklist)
                </h4>
                <div id="todayVisitsList" class="space-y-3">
                    <!-- Dynamic Items -->
                </div>
            </section>

            <!-- Quick Action: Add Visit -->
            <button onclick="openVisitModal()" class="w-full bg-blue-600 text-white flex items-center justify-center gap-2 p-4 rounded-2xl shadow-lg font-bold sticky bottom-20 z-40">
                <i data-lucide="plus-circle" class="w-6 h-6"></i>
                تسجيل زيارة عيادة جديدة
            </button>

            <!-- Upcoming Visits -->
            <section>
                <h4 class="flex items-center gap-2 font-bold mb-4 px-2 text-gray-600">
                    <i data-lucide="clock" class="w-5 h-5"></i>
                    المواعيد القادمة
                </h4>
                <div id="upcomingVisitsList" class="space-y-4 pb-10">
                    <!-- Dynamic Cards -->
                </div>
            </section>
        </main>

        <!-- Bottom Menu -->
        <nav class="fixed bottom-0 left-0 right-0 bg-white border-t flex justify-around p-3 z-50">
            <button onclick="handleLogout()" class="flex flex-col items-center text-red-500">
                <i data-lucide="log-out" class="w-6 h-6"></i>
                <span class="text-[10px]">خروج</span>
            </button>
        </nav>
    </section>

    <!-- Modals -->
    <!-- New Visit Modal -->
    <div id="visitModal" class="fixed inset-0 bg-black/60 z-[60] flex items-end sm:items-center justify-center hidden">
        <div class="bg-white w-full max-w-lg rounded-t-[2rem] sm:rounded-2xl p-6 h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold">نموذج زيارة جديدة</h3>
                <button onclick="closeVisitModal()" class="p-2 bg-gray-100 rounded-full"><i data-lucide="x"></i></button>
            </div>
            
            <form id="visitForm" class="space-y-5 pb-10 text-right">
                <div>
                    <label class="block text-sm font-semibold mb-2">اسم الدكتور *</label>
                    <input type="text" id="drName" required class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold mb-2">اسم العيادة/المركز *</label>
                    <input type="text" id="clinicName" required class="w-full p-3 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                
                <div>
                    <label class="block text-sm font-semibold mb-2">تخصص العيادة</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg cursor-pointer"><input type="checkbox" name="specialty" value="تركيبات"> تركيبات</label>
                        <label class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg cursor-pointer"><input type="checkbox" name="specialty" value="زراعة"> زراعة</label>
                        <label class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg cursor-pointer"><input type="checkbox" name="specialty" value="تقويم"> تقويم</label>
                        <label class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg cursor-pointer"><input type="checkbox" name="specialty" value="أسنان عام"> أسنان عام</label>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-semibold mb-2">رقم الهاتف 1 *</label>
                        <input type="tel" id="phone1" required class="w-full p-3 bg-gray-50 border rounded-xl">
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">رقم الهاتف 2</label>
                        <input type="tel" id="phone2" class="w-full p-3 bg-gray-50 border rounded-xl">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">العنوان</label>
                    <input type="text" id="address" class="w-full p-3 bg-gray-50 border rounded-xl">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">الموقع الجغرافي (GPS)</label>
                    <div class="flex gap-2">
                        <input type="text" id="gpsLink" placeholder="رابط الخريطة" class="flex-1 p-3 bg-gray-50 border rounded-xl text-xs">
                        <button type="button" onclick="getCurrentLocation()" class="bg-blue-100 text-blue-700 px-4 rounded-xl flex items-center gap-1 text-xs font-bold">
                            <i data-lucide="map-pin" class="w-4 h-4"></i> جلب
                        </button>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">المواد الدعائية</label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg"><input type="checkbox" name="promo" value="بروشور"> بروشور</label>
                        <label class="flex items-center gap-2 p-2 bg-gray-50 rounded-lg"><input type="checkbox" name="promo" value="عينة مجانية"> عينة مجانية</label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">حالة الزيارة</label>
                    <select id="visitStatus" onchange="toggleNextVisitDate()" class="w-full p-3 bg-gray-50 border rounded-xl">
                        <option value="مهتم بالشراء">مهتم بالشراء</option>
                        <option value="يطلب سعر">يطلب سعر</option>
                        <option value="يحتاج متابعة">يحتاج متابعة</option>
                        <option value="غير مهتم">غير مهتم</option>
                        <option value="تم تحديد موعد لمقابلة الطبيب">تم تحديد موعد لمقابلة الطبيب</option>
                    </select>
                </div>

                <div id="nextVisitContainer" class="hidden">
                    <label class="block text-sm font-semibold mb-2">موعد الزيارة القادمة</label>
                    <input type="datetime-local" id="nextVisitDate" class="w-full p-3 bg-gray-50 border rounded-xl">
                </div>

                <div>
                    <label class="block text-sm font-semibold mb-2">ملاحظات واحتياجات</label>
                    <textarea id="notes" rows="3" class="w-full p-3 bg-gray-50 border rounded-xl"></textarea>
                </div>

                <div class="flex gap-3">
                    <button type="button" onclick="submitVisit()" class="flex-1 bg-blue-600 text-white font-bold py-4 rounded-xl">حفظ الزيارة</button>
                    <button type="button" onclick="closeVisitModal()" class="flex-1 bg-gray-200 font-bold py-4 rounded-xl">إلغاء</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Stats Modal -->
    <div id="statsModal" class="fixed inset-0 bg-black/60 z-[60] flex items-end sm:items-center justify-center hidden">
        <div class="bg-white w-full max-w-lg rounded-t-2xl p-6 max-h-[80vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold">تفاصيل زيارات الشهر</h3>
                <button onclick="closeStatsModal()"><i data-lucide="x"></i></button>
            </div>
            <div id="statsList" class="space-y-3">
                <!-- Monthly details -->
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
